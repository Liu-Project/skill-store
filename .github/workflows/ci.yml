name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and test
        run: npm run verify

      - name: Build VSIX
        if: matrix.node == 20
        run: npm run package

      - name: Upload VSIX
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: skillstore-vsix
          path: "*.vsix"
          if-no-files-found: error
